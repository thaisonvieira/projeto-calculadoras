<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tabuada</title>
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <!--Estilo-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: #F0F0F0;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-area {
            padding: 20px;
            background-color: #FFF;
            box-shadow: 0px 0px 5px rgba(39, 39, 39, 0.3);
        }

        h1 {
            margin-bottom: 20px;
        }

        form label {
            font-size: 17px;
        }

        form input, button {
            display: block;
            height: 30px;
            margin-top: 10px;
        }

        form input {
            padding: 0px 10px;
        }

        form button {
            padding: 5px 20px;
            color: #FFF;
            font-size: 15px;
            text-shadow: 0px 0px 0px black;
            background-color: #3399FF;
            border: none;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        form button:hover {
            background-color: #2871bb;
        }

        .bloco-resultado, .bloco-invalido {
            margin-top: 10px;
            padding: 20px;
            line-height: 1.5em;
        }

        .bloco-resultado {
            background-color: #F0F0F0;
        }
    </style>
</head>
<body>
    <!--Conteúdo-->
    <div class="container">
        <div class="form-area">
            <h1>Tabuada de um número N</h1>
            <form action="/" method="POST" id="form-tabuada">
                <label for="iNumero">Informe um número inteiro:</label>
                <input type="number" min="1" id="iNumero" autocomplete="off">
                <button type="submit">Calcular</button>
            </form>
            <div id="resultado"></div>
        </div>
    </div>

    <!--Código-->
    <script>
        const form = document.getElementById("form-tabuada");
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            // console.log("Evento previnido.");

            const inputNumero = e.target.querySelector('#iNumero');
            const num = Number(inputNumero.value);
            // console.log(inputNumero);
            // console.log(num);

            setTabuada(num);

        });

        function setTabuada (num, isValid) {
            let i;
            const resultado = document.querySelector('#resultado');
            resultado.innerHTML = '';
            resultado.classList.add('bloco-resultado');

            for (i = 1; i <= 10; i++) {
                let p = document.createElement('p');
                p.innerHTML = `${num} x ${i} = ${num * i}`;
                resultado.appendChild(p);
            }
        }
    </script>
</body>
</html>
